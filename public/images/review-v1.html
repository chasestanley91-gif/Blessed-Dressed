  select,input[type=search]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .btn{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  .btn:hover{border-color:var(--gold)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  #progress{margin-left:auto;font-size:13px;color:var(--muted)}
  #bar{height:4px;background:var(--line)} #barfill{height:4px;background:var(--gold);width:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}

  .a.dis.on{background:#eee;border-color:#777;color:#444;font-weight:700}
  .a.btp.on{background:#fff4e5;border-color:#a05a00;color:#a05a00;font-weight:700}
  .clr{font-size:11px;color:var(--muted);cursor:pointer;margin-left:6px;text-decoration:underline}
  .imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line)}
  .imgs figure{margin:0;background:#fff;padding:8px;text-align:center}
  .imgs img{max-width:100%;max-height:210px;object-fit:contain;cursor:zoom-in}
  .imgs figcaption{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
  .meta{padding:10px 12px 4px}
  .meta b{font-size:14.5px} .meta .sub{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;color:var(--muted)}
  .actions{display:flex;gap:6px;padding:10px 12px 12px;align-items:center}
  .actions .a{flex:1;padding:8px 0;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:13px}
  .a.acc.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
  .a.rem.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
  .note{display:none;padding:0 12px 12px} .note.show{display:block}
  .note input{width:100%;font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px}
  .missing{padding:26px 8px;color:var(--muted);font-size:13px;text-align:center}
  #orphans{max-width:1280px;margin:10px auto 60px;padding:0 20px;font-size:13px;color:var(--muted)}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;z-index:99}
  #zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;cursor:zoom-out;align-items:center;justify-content:center}
  #zoom img{max-width:94vw;max-height:94vh;background:#fff}

const LS = 'bd-review-v1';
let state = JSON.parse(localStorage.getItem(LS) || '{}');
const cards = DATA.cards;
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
function keyOf(c){ return c.garments[0] + '|' + c.category + '|' + c.id; }
// migrate legacy keys (garment|id) to every matching category-scoped card
(function(){
  let changed = false;
  for (const c of cards){
    const legacy = c.garments[0] + '|' + c.id, k = keyOf(c);
    if (state[legacy] !== undefined && state[k] === undefined){ state[k] = state[legacy]; changed = true; }
  }
  for (const key of Object.keys(state)) if (key.split('|').length === 2){ delete state[key]; changed = true; }
  if (changed) localStorage.setItem(LS, JSON.stringify(state));
})();
const save = () => localStorage.setItem(LS, JSON.stringify(state));

const garments = [...new Set(cards.flatMap(c => c.garments))].sort();
const cats = [...new Set(cards.map(c => c.category))].sort();
garments.forEach(g => fGarment.add(new Option(g, g)));
cats.forEach(c => fCategory.add(new Option(c, c)));

function figs(c){
  let h = '<figure>' + (c.illustration ? '<img loading="lazy" src="' + c.illustration + '">' : '<div class="missing">no tech pack on file</div>') + '<figcaption>tech pack</figcaption></figure>';
  if (!c.photos.length) h += '<figure><div class="missing">not generated yet</div><figcaption>photo</figcaption></figure>';
  c.photos.forEach((p, i) => {
    const cap = p.includes('-v') ? p.split('/').pop().replace(/^.*-(v\d+[^.]*)\..*$/, '$1') : (i === 0 ? 'photo' : 'example ' + (i + 1));
    h += '<figure><img loading="lazy" src="' + p + '"><figcaption>' + cap + '</figcaption></figure>';
  });
  return h;
}
function render(){
  grid.innerHTML = '';
  const g = fGarment.value, cat = fCategory.value, st = fState.value,
        q = fSearch.value.toLowerCase(), noP = fNoPhoto.checked;
  let shown = 0;
  for (const c of cards){
    if (!c.photos.length && !noP) continue;
    if (g && !c.garments.includes(g)) continue;
    if (cat && c.category !== cat) continue;
    const s = state[keyOf(c)];
    if (st === 'un' && s) continue;
    if (st && st !== 'un' && (!s || s.v !== st)) continue;
    if (q && !(c.label.toLowerCase().includes(q) || c.id.toLowerCase().includes(q))) continue;
    shown++;
    const card = el('div', 'card' + (s ? ' ' + s.v : ''));
    card.dataset.k = keyOf(c);
    const imgs = el('div', 'imgs');
    imgs.innerHTML = figs(c);
    imgs.querySelectorAll('img').forEach(im => im.onclick = () => { zoomImg.src = im.src; zoom.style.display = 'flex'; });
    const meta = el('div', 'meta');
    meta.innerHTML = '<b>' + c.label + '</b><span class="chip">' + c.category + '</span><span class="chip">' + c.garments.join(', ') + '</span>' +
      (c.photos.length > 1 ? '<span class="chip">' + c.photos.length + ' photos</span>' : '') +
      '<div class="sub">' + c.id + '</div>';
    const act = el('div', 'actions');
    const noteWrap = el('div', 'note' + (s && s.v && s.v !== 'accept' ? ' show' : ''));
    const note = document.createElement('input');
    note.placeholder = "what's wrong? (optional — guides the fix)";
    note.value = (s && s.note) || '';
    note.oninput = () => { const cur = state[keyOf(c)]; state[keyOf(c)] = {v: (cur && cur.v) || 'remake', note: note.value}; save(); updProgress(); };
    noteWrap.appendChild(note);
    const mk = (cls, txt, v) => {
      const b = el('button', 'a ' + cls + (s && s.v === v ? ' on' : ''));
      b.textContent = txt; b.title = ({accept:'Images are right',remake:'Regenerate the photo (no photo yet = generate it)',discard:'Drop this option from the lineup entirely',badtp:'The tech-pack illustration itself is wrong/unusable'})[v];
      b.onclick = () => { state[keyOf(c)] = {v: v, note: note.value}; save(); render(); };
      return b;
    };
    const clr = el('span', 'clr'); clr.textContent = 'clear';
    clr.onclick = () => { delete state[keyOf(c)]; save(); render(); };
    if (s) meta.appendChild(clr);
    act.append(mk('acc', 'Accept', 'accept'), mk('rem', 'Remake', 'remake'),
               mk('dis', 'Discard', 'discard'), mk('btp', 'Bad pack', 'badtp'));
    card.append(imgs, meta, act, noteWrap);
    grid.appendChild(card);
  }
  updProgress(shown);
}
function updProgress(shown){
  const withPhoto = cards.filter(c => c.photos.length);
  const done = withPhoto.filter(c => state[keyOf(c)]).length;
  const n = v => Object.values(state).filter(s => s.v === v).length;
  progress.textContent = done + '/' + withPhoto.length + ' reviewed \u00b7 ' + n('remake') + ' remake \u00b7 ' + n('discard') + ' discard \u00b7 ' + n('badtp') + ' bad pack' + (shown !== undefined ? ' \u00b7 showing ' + shown : '');
  barfill.style.width = (100 * done / Math.max(1, withPhoto.length)) + '%';
}
function decisions(){
  const remakes = [], accepted = [], discards = [], badtps = [];
  for (const c of cards){
    const s = state[keyOf(c)];
    if (!s) continue;
    const entry = {garment: c.garments[0], category: c.category, id: c.id, label: c.label, note: s.note || ''};
    if (s.v === 'remake') remakes.push(entry);
    else if (s.v === 'discard') discards.push(entry);
    else if (s.v === 'badtp') badtps.push(entry);
    else accepted.push(c.category + '|' + c.id);
  }
  return {exported: new Date().toISOString(), format: 2, accepted_count: accepted.length,
          accepted_ids: accepted, remakes: remakes, discards: discards,
          bad_tech_packs: badtps,
          unreviewed: cards.filter(c => c.photos.length && !state[keyOf(c)]).length};
}
copyBtn.onclick = async () => {
  const d = decisions();
  const compact = {exported: d.exported, format: 2, accepted_count: d.accepted_count, unreviewed: d.unreviewed, remakes: d.remakes, discards: d.discards, bad_tech_packs: d.bad_tech_packs};
  const text = JSON.stringify(compact, null, 1);
  try { await navigator.clipboard.writeText(text); toastMsg('Copied \u2014 paste it to Claude'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toastMsg('Copied \u2014 paste it to Claude');
  }
};
dlBtn.onclick = () => {
  const b = new Blob([JSON.stringify(decisions(), null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = 'decisions.json'; a.click();
};
acceptRest.onclick = () => {
  document.querySelectorAll('#grid .card').forEach(cd => {
    const k = cd.dataset.k;
    if (!state[k]) state[k] = {v: 'accept'};
  });
  save(); render(); toastMsg('Accepted all shown (existing decisions kept)');
};
function toastMsg(t){ toast.textContent = t; toast.style.opacity = 1; setTimeout(() => toast.style.opacity = 0, 2200); }
[fGarment, fCategory, fState, fNoPhoto, fSearch].forEach(x => x.addEventListener('input', render));
if (DATA.orphans.length) {
  orphans.innerHTML = '<b>' + DATA.orphans.length + ' orphan generated photos</b> (no option references them): ' + DATA.orphans.join(' \u00b7 ');
}
render();
</script></body></html>
