<style id="page-style">
  :root {
    --ground: #EDEFEE;
    --surface: #F8F9F8;
    --surface-2: #E4E7E5;
    --ink: #16191C;
    --ink-muted: #565E66;
    --ink-faint: #7B848C;
    --rule: #D0D5D2;
    --rule-firm: #B6BDB9;
    --navy: #1F3A5F;
    --navy-soft: #DDE4EE;
    --brass: #7E6118;
    --brass-soft: #F0E7CF;
    --thread: #2A5A43;
    --thread-soft: #DCEAE2;
    --oxblood: #7A2B2B;
    --oxblood-soft: #F2DEDE;
    --display: "Spectral", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131619; --surface: #1A1E22; --surface-2: #23282D;
      --ink: #E7EAE8; --ink-muted: #9BA3A9; --ink-faint: #788188;
      --rule: #2D333A; --rule-firm: #3D444C;
      --navy: #86AAD2; --navy-soft: #1E2A38;
      --brass: #C9A64F; --brass-soft: #2E2717;
      --thread: #74B294; --thread-soft: #16281F;
      --oxblood: #D08E8E; --oxblood-soft: #331E1E;
    }
  }
  :root[data-theme="dark"] {
    --ground: #131619; --surface: #1A1E22; --surface-2: #23282D;
    --ink: #E7EAE8; --ink-muted: #9BA3A9; --ink-faint: #788188;
    --rule: #2D333A; --rule-firm: #3D444C;
    --navy: #86AAD2; --navy-soft: #1E2A38;
    --brass: #C9A64F; --brass-soft: #2E2717;
    --thread: #74B294; --thread-soft: #16281F;
    --oxblood: #D08E8E; --oxblood-soft: #331E1E;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    margin: 0; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 22px 96px; display: flex; flex-direction: column; gap: 42px; }
  a { color: var(--navy); text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, .row label:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }

  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); margin: 0; }
  h1 { font-family: var(--display); font-size: clamp(2.1rem, 5vw, 3rem); line-height: 1.07; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  .standfirst { font-family: var(--display); font-size: 1.14rem; line-height: 1.5; color: var(--ink-muted); margin: 0; max-width: 60ch; }

  header.masthead { display: flex; flex-direction: column; gap: 16px; }

  /* progress */
  .progress { display: flex; flex-direction: column; gap: 9px; }
  .progress .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: .84rem; color: var(--ink-muted); }
  .progress .meta strong { font-family: var(--mono); font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--surface-2); border-radius: 2px; overflow: hidden; border: 1px solid var(--rule); }
  .track span { display: block; height: 100%; background: var(--thread); transition: width .3s ease; }
  @media (prefers-reduced-motion: reduce) { .track span { transition: none; } }

  .saveline { font-family: var(--mono); font-size: .76rem; color: var(--ink-faint); min-height: 1.2em; }
  .saveline.warn { color: var(--oxblood); }

  section { display: flex; flex-direction: column; gap: 16px; }
  h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; margin: 0; padding-bottom: 9px; border-bottom: 1px solid var(--rule-firm); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-wrap: balance; }
  h2 .tally { font-family: var(--mono); font-size: .82rem; font-weight: 400; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  p { margin: 0; max-width: 68ch; }
  .lede { color: var(--ink-muted); font-size: .94rem; }

  /* rows */
  .rows { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 30px 1fr; gap: 13px; padding: 13px 15px; background: var(--surface); border-bottom: 1px solid var(--rule); align-items: start; }
  .row:last-child { border-bottom: 0; }
  .row.done { background: var(--thread-soft); }
  .row.done .name { text-decoration: line-through; text-decoration-color: var(--ink-faint); color: var(--ink-muted); }

  .row label { display: flex; align-items: center; justify-content: center; padding-top: 2px; cursor: pointer; }
  .row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--thread); cursor: pointer; margin: 0; }
  .row.locked input[type="checkbox"] { cursor: not-allowed; opacity: .45; }

  .body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; font-size: .96rem; }
  .target { font-family: var(--mono); font-size: .8rem; color: var(--navy); word-break: break-all; }
  .note { font-size: .86rem; color: var(--ink-muted); }

  .chip { display: inline-block; font-family: var(--mono); font-size: 9.5px; font-weight: 500; letter-spacing: .04em; padding: 2px 6px; border-radius: 2px; white-space: nowrap; }
  .chip.a { background: var(--thread-soft); color: var(--thread); }
  .chip.b { background: var(--navy-soft); color: var(--navy); }
  .chip.c { background: var(--surface-2); color: var(--ink-faint); }
  .chip.d { background: var(--oxblood-soft); color: var(--oxblood); }
  .chip.flag { background: var(--brass-soft); color: var(--brass); }

  /* paste block */
  .paste { background: var(--surface); border: 1px solid var(--rule); border-radius: 2px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .paste h3 { font-size: .95rem; font-weight: 600; margin: 0; }
  .paste pre { font-family: var(--mono); font-size: .8rem; line-height: 1.6; background: var(--surface-2); border-radius: 2px; padding: 13px 15px; margin: 0; overflow-x: auto; white-space: pre-wrap; color: var(--ink); }
  .paste button { font-family: var(--sans); font-size: .82rem; font-weight: 600; background: var(--navy); color: var(--ground); border: 0; border-radius: 2px; padding: 8px 15px; cursor: pointer; align-self: flex-start; }
  .paste button:hover { opacity: .9; }

  .callout { background: var(--surface); border-left: 3px solid var(--brass); border-radius: 0 2px 2px 0; padding: 15px 19px; display: flex; flex-direction: column; gap: 7px; }
  .callout.stop { border-left-color: var(--oxblood); }
  .callout h3 { font-size: .93rem; font-weight: 600; margin: 0; }
  .callout p { font-size: .89rem; color: var(--ink-muted); }

  footer { border-top: 1px solid var(--rule-firm); padding-top: 18px; font-size: .81rem; color: var(--ink-faint); display: flex; flex-direction: column; gap: 6px; }
  footer code { font-family: var(--mono); font-size: .95em; }
</style>

  function readState() {
    try {
      var el = document.getElementById("state");
      var s = JSON.parse(el.textContent);
      if (!s || typeof s !== "object") throw new Error("bad");
      s.done = s.done && typeof s.done === "object" ? s.done : {};
      return s;
    } catch (e) {
      return { done: {}, updated: null };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")

    if (t.g === "email") return "mailto:" + t.target;
    if (t.g === "call") return "tel:" + t.target.replace(/[^+0-9]/g, "");
    if (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(t.target)) return "https://" + t.target.replace(/^https?:\/\//, "");
    return null;
  }

  // ---- render ---------------------------------------------------------------
  function renderBody() {
    var total = TASKS.length;
    var doneCount = TASKS.filter(function (t) { return state.done[t.id]; }).length;
    var pct = total ? Math.round((doneCount / total) * 100) : 0;

    var h = "";
    h += '<header class="masthead">';
    h += '<p class="eyebrow">Blessed &amp; Dressed · Cloth Sourcing · Outreach</p>';
    h += '<h1>The Cloth Call Sheet</h1>';
    h += '<p class="standfirst">Every supplier worth contacting, in the order worth contacting them. Tick as you go — the page remembers.</p>';
    h += '<div class="progress"><div class="meta"><span><strong>' + doneCount + '</strong> of ' + total + ' contacted</span><span>' + pct + '%</span></div>';
    h += '<div class="track"><span style="width:' + pct + '%"></span></div>';
    h += '<div class="saveline' + (saveWarn ? " warn" : "") + '">' + esc(saveMsg) + "</div></div>";
    h += "</header>";

    if (!writable) {
      h += '<div class="callout stop"><h3>This is a read-only view</h3>';
      h += "<p>Ticks will not save from here. Open the artifact from your own gallery to check items off.</p></div>";
    }

    h += '<div class="callout"><h3>Before you send anything</h3>';
    h += "<p>Two things raise your reply rate more than any wording change. Get a business email on your own domain — a trade desk reading a Gmail address discounts you before the first line. And have your EIN and resale certificate scanned and ready; several of these will ask on the first reply, and the ones that ask are the ones worth having.</p></div>";

    GROUPS.forEach(function (grp) {
      var rows = TASKS.filter(function (t) { return t.g === grp.key; });
      var d = rows.filter(function (t) { return state.done[t.id]; }).length;
      h += "<section>";
      h += "<h2>" + esc(grp.title) + '<span class="tally">' + d + " / " + rows.length + "</span></h2>";
      h += '<p class="lede">' + esc(grp.blurb) + "</p>";
      h += '<div class="rows">';
      rows.forEach(function (t) {
        var on = !!state.done[t.id];
        var link = href(t);
        h += '<div class="row' + (on ? " done" : "") + (writable ? "" : " locked") + '">';
        h += '<label><input type="checkbox" data-id="' + esc(t.id) + '"' + (on ? " checked" : "") +
             (writable ? "" : " disabled") + ' aria-label="Mark ' + esc(t.name) + ' contacted"></label>';
        h += '<div class="body"><div class="line1">';
        h += '<span class="name">' + esc(t.name) + "</span>";
        h += '<span class="chip ' + t.tier.toLowerCase() + '">TIER ' + esc(t.tier) + "</span>";
        if (t.id === "ocm" || t.id === "yunai" || t.id === "raymond" || t.id === "altinyildiz") {
          h += '<span class="chip flag">VERIFY ADDRESS</span>';
        }
        h += "</div>";
        h += '<span class="target">' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(t.target) + "</a>" : esc(t.target)) + "</span>";
        h += '<span class="note">' + esc(t.note) + "</span>";
        h += "</div></div>";
      });
      h += "</div>";

      if (grp.key === "form") {
        h += '<div class="paste"><h3>Paste this into any form</h3>';
        h += "<pre>" + esc(PASTE) + "</pre>";
        h += '<button type="button" id="copybtn">Copy to clipboard</button></div>';
      }
      h += "</section>";
    });

    h += "<footer>";
    h += "<p>Full detail on every supplier — price bands, swatch terms, cut-length policy, evidence — lives in <code>sourcing/FABRIC-SUPPLIERS.md</code>, with the strategy behind this sequence in <code>sourcing/OUTREACH-PLAN.md</code>.</p>";
    h += "<p>Never state your target price to any vendor. Ask what theirs is. And share no tech packs, patterns or customer data with the twelve mills that also make finished garments.</p>";
    if (state.updated) h += "<p>Last ticked " + esc(state.updated) + ".</p>";
    h += "</footer>";
    return h;
  }

  function paint() {
    document.getElementById("app").innerHTML = renderBody();
    var btn = document.getElementById("copybtn");
    if (btn) {
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(PASTE).then(function () {
          btn.textContent = "Copied";
          setTimeout(function () { btn.textContent = "Copy to clipboard"; }, 1800);
        }, function () {
          btn.textContent = "Press Ctrl+C to copy";
        });
      });
    }
  }

  // ---- publish --------------------------------------------------------------
  function buildDocument() {
    var css = document.getElementById("page-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var fonts =
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
    var open = "<" + "script";
    var close = "<" + "/script>";
    return "<!doctype html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n" +
      "<title>The Cloth Call Sheet</title>\n" + fonts +
      "\n<style id=\"page-style\">" + css + "</style>\n</head>\n<body>\n" +
      '<div class="wrap" id="app"></div>\n' +
      open + ' type="application/json" id="state">' + JSON.stringify(state) + close + "\n" +
      open + ' id="app-script">' + js + close + "\n</body>\n</html>";
  }

  function setSave(msg, warn) {
    saveMsg = msg || "";
    saveWarn = !!warn;
    var el = document.querySelector(".saveline");
    if (el) {
      el.textContent = saveMsg;
      el.className = "saveline" + (saveWarn ? " warn" : "");
    }
  }

  function flush() {
    pending = null;
    if (!writable) return;
    if (!api) {
      // the capability has not resolved yet — hold the tick and retry shortly
      if (waited < 12000) { waited += 700; schedule(700); }
      else setSave("Saving is unavailable in this view.", true);
      return;
    }
    setSave("Saving…", false);
    api.publish(buildDocument()).then(function () {
      // this view reloads to the new version; nothing more to do
    }, function (err) {
      var code = (err && err.code) || "upstream_error";
      if (code === "conflict") {
        setSave("Someone else saved first — reloading to their version.", false);
        return; // the shell is already reloading every view
      }
      if (code === "not_writer" || code === "not_granted" ||
          code === "not_declared" || code === "capability_disabled" ||
          code === "capability_removed" || code === "consent_required") {
        writable = false;
        paint();
        setSave("Read-only view — ticks are not saved.", true);
        return;
      }
      if (code === "rate_limited") {
        setSave("Saving too fast — pausing, then trying again.", true);
        schedule(6000);
        return;
      }
      setSave("Could not save that tick. Try again in a moment.", true);
    });
  }

  function schedule(delay) {
    if (pending) clearTimeout(pending);
    pending = setTimeout(flush, delay == null ? 900 : delay);
  }

  // ---- events ---------------------------------------------------------------
  document.addEventListener("change", function (e) {
    var box = e.target;
    if (!box || box.type !== "checkbox" || !box.dataset.id) return;
    if (!writable) { box.checked = !box.checked; return; }
    if (box.checked) state.done[box.dataset.id] = true;
    else delete state.done[box.dataset.id];
    state.updated = new Date().toISOString().slice(0, 10);
    paint();
    setSave("Saving…", false);
    schedule();
  });

  paint();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      if (!ns) { writable = false; paint(); return; }
      api = ns;
    }, function () { writable = false; paint(); });
  } else {
    writable = false;
    paint();
  }
})();
</script>
