<style id="page-style">
  :root {
    --ground: #EDEFEE;
    --surface: #F8F9F8;
    --surface-2: #E4E7E5;
    --ink: #16191C;
    --ink-muted: #565E66;
    --ink-faint: #7B848C;
    --rule: #D0D5D2;
    --rule-firm: #B6BDB9;
    --navy: #1F3A5F;
    --navy-soft: #DDE4EE;
    --brass: #7E6118;
    --brass-soft: #F0E7CF;
    --thread: #2A5A43;
    --thread-soft: #DCEAE2;
    --oxblood: #7A2B2B;
    --oxblood-soft: #F2DEDE;
    --display: "Spectral", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131619; --surface: #1A1E22; --surface-2: #23282D;
      --ink: #E7EAE8; --ink-muted: #9BA3A9; --ink-faint: #788188;
      --rule: #2D333A; --rule-firm: #3D444C;
      --navy: #86AAD2; --navy-soft: #1E2A38;
      --brass: #C9A64F; --brass-soft: #2E2717;
      --thread: #74B294; --thread-soft: #16281F;
      --oxblood: #D08E8E; --oxblood-soft: #331E1E;
    }
  }
  :root[data-theme="dark"] {
    --ground: #131619; --surface: #1A1E22; --surface-2: #23282D;
    --ink: #E7EAE8; --ink-muted: #9BA3A9; --ink-faint: #788188;
    --rule: #2D333A; --rule-firm: #3D444C;
    --navy: #86AAD2; --navy-soft: #1E2A38;
    --brass: #C9A64F; --brass-soft: #2E2717;
    --thread: #74B294; --thread-soft: #16281F;
    --oxblood: #D08E8E; --oxblood-soft: #331E1E;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    margin: 0; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 22px 96px; display: flex; flex-direction: column; gap: 42px; }
  a { color: var(--navy); text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, .row label:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }

  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); margin: 0; }
  h1 { font-family: var(--display); font-size: clamp(2.1rem, 5vw, 3rem); line-height: 1.07; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  .standfirst { font-family: var(--display); font-size: 1.14rem; line-height: 1.5; color: var(--ink-muted); margin: 0; max-width: 60ch; }

  header.masthead { display: flex; flex-direction: column; gap: 16px; }

  /* progress */
  .progress { display: flex; flex-direction: column; gap: 9px; }
  .progress .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: .84rem; color: var(--ink-muted); }
  .progress .meta strong { font-family: var(--mono); font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--surface-2); border-radius: 2px; overflow: hidden; border: 1px solid var(--rule); }
  .track span { display: block; height: 100%; background: var(--thread); transition: width .3s ease; }
  @media (prefers-reduced-motion: reduce) { .track span { transition: none; } }

  .saveline { font-family: var(--mono); font-size: .76rem; color: var(--ink-faint); min-height: 1.2em; }
  .saveline.warn { color: var(--oxblood); }

  section { display: flex; flex-direction: column; gap: 16px; }
  h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; margin: 0; padding-bottom: 9px; border-bottom: 1px solid var(--rule-firm); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-wrap: balance; }
  h2 .tally { font-family: var(--mono); font-size: .82rem; font-weight: 400; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  p { margin: 0; max-width: 68ch; }
  .lede { color: var(--ink-muted); font-size: .94rem; }

  /* rows */
  .rows { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 30px 1fr; gap: 13px; padding: 13px 15px; background: var(--surface); border-bottom: 1px solid var(--rule); align-items: start; }
  .row:last-child { border-bottom: 0; }
  .row.done { background: var(--thread-soft); }
  .row.done .name { text-decoration: line-through; text-decoration-color: var(--ink-faint); color: var(--ink-muted); }

  .row label { display: flex; align-items: center; justify-content: center; padding-top: 2px; cursor: pointer; }
  .row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--thread); cursor: pointer; margin: 0; }
  .row.locked input[type="checkbox"] { cursor: not-allowed; opacity: .45; }

  .body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; font-size: .96rem; }
  .target { font-family: var(--mono); font-size: .8rem; color: var(--navy); word-break: break-all; }
  .note { font-size: .86rem; color: var(--ink-muted); }

  .chip { display: inline-block; font-family: var(--mono); font-size: 9.5px; font-weight: 500; letter-spacing: .04em; padding: 2px 6px; border-radius: 2px; white-space: nowrap; }
  .chip.a { background: var(--thread-soft); color: var(--thread); }
  .chip.b { background: var(--navy-soft); color: var(--navy); }
  .chip.c { background: var(--surface-2); color: var(--ink-faint); }
  .chip.d { background: var(--oxblood-soft); color: var(--oxblood); }
  .chip.flag { background: var(--brass-soft); color: var(--brass); }

  /* paste block */
  .paste { background: var(--surface); border: 1px solid var(--rule); border-radius: 2px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .paste h3 { font-size: .95rem; font-weight: 600; margin: 0; }
  .paste pre { font-family: var(--mono); font-size: .8rem; line-height: 1.6; background: var(--surface-2); border-radius: 2px; padding: 13px 15px; margin: 0; overflow-x: auto; white-space: pre-wrap; color: var(--ink); }
  .paste button { font-family: var(--sans); font-size: .82rem; font-weight: 600; background: var(--navy); color: var(--ground); border: 0; border-radius: 2px; padding: 8px 15px; cursor: pointer; align-self: flex-start; }
  .paste button:hover { opacity: .9; }

  .callout { background: var(--surface); border-left: 3px solid var(--brass); border-radius: 0 2px 2px 0; padding: 15px 19px; display: flex; flex-direction: column; gap: 7px; }
  .callout.stop { border-left-color: var(--oxblood); }
  .callout h3 { font-size: .93rem; font-weight: 600; margin: 0; }
  .callout p { font-size: .89rem; color: var(--ink-muted); }

  footer { border-top: 1px solid var(--rule-firm); padding-top: 18px; font-size: .81rem; color: var(--ink-faint); display: flex; flex-direction: column; gap: 6px; }
  footer code { font-family: var(--mono); font-size: .95em; }

  /* ---- stage machinery ---- */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .cell { background: var(--surface); padding: 12px 13px; }
  .cell .n { font-family: var(--mono); font-size: 1.5rem; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .cell .l { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-top: 4px; }
  .cell.act .n { color: var(--oxblood); }
  .cell.won .n { color: var(--thread); }
  .cell.wait .n { color: var(--brass); }

  .filters { display: flex; flex-wrap: wrap; gap: 7px; }
  .filters button { font-family: var(--sans); font-size: .78rem; font-weight: 500; background: var(--surface); color: var(--ink-muted); border: 1px solid var(--rule); border-radius: 2px; padding: 5px 11px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--navy); color: var(--ground); border-color: var(--navy); }

  .row { grid-template-columns: 1fr; }
  .rowtop { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
  .row select { font-family: var(--mono); font-size: .74rem; font-weight: 500; letter-spacing: .03em; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--rule-firm); background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .row select:disabled { opacity: .5; cursor: not-allowed; }
  .row .noteline { display: flex; align-items: center; gap: 8px; }
  .row .noteline input { flex: 1; min-width: 0; font-family: var(--sans); font-size: .82rem; padding: 5px 8px; border-radius: 2px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); }
  .row .noteline input::placeholder { color: var(--ink-faint); }
  .row .noteline input:disabled { opacity: .5; }

  .row.s-replied { background: var(--oxblood-soft); }
  .row.s-won     { background: var(--thread-soft); }
  .row.s-warm    { background: var(--brass-soft); }
  .row.s-no      { opacity: .55; }
  .row.s-no .name { text-decoration: line-through; text-decoration-color: var(--ink-faint); }
  .row.s-contacted .name { color: var(--ink-muted); }
</style>

    { id: "luthai", g: "form", tier: "B", name: "Luthai Textile", target: "luthai.com",
      note: "World's largest yarn-dyed shirting mill, ~$6.80/m dealer reference. Routed via distributors; has a garment arm." },
    { id: "fabricmart", g: "form", tier: "B", name: "Fabric Mart", target: "fabricmartfabrics.com",
      note: "VERIFIED today: poly/wool suiting $8.75–$10.50/yd in stock, an Italian 100% wool stripe at $5.63/yd, and a $2/yd clearance bin — sold in quarter-yard steps, so a 3.5 yd cut is exact. No outreach needed, just shop it." },
    { id: "ffc", g: "form", tier: "B", name: "Fashion Fabrics Club", target: "fashionfabricsclub.com",
      note: "$8–15/yd suiting, in band. Closeout, so no reorders. Same firm as Fabric Depot." },
    { id: "yutai", g: "form", tier: "C", name: "Yutai Textiles", target: "yutaitextiles.com",
      note: "Poplin specialist since 1999. Relevant to the 100% cotton shirting programme." },
    { id: "mafatlal", g: "form", tier: "C", name: "Mafatlal Industries", target: "mafatlals.com",
      note: "Long-established Indian shirting name. Thin evidence so far — treat as a lead to qualify." },
    { id: "huzhou", g: "form", tier: "C", name: "Huzhou Shichang Textile", target: "sctextile.goldsupplier.com",
      note: "Cotton/spandex twill producer. Lead only." },
    { id: "wooltex", g: "form", tier: "C", name: "Wooltex", target: "wooltex.com",
      note: "Makes wool suiting fabric and wool suits. Lower priority on your free-and-clear rule." },
    { id: "bhilwara", g: "form", tier: "C", name: "Bhilwara cluster", target: "ExportersIndia listings",
      note: "Mascot, Oxford Intl, Siddhartha, Ekta, Dheer Dada. Cheapest in the ledger but 200–500 m minimums block single-length buying." },
    { id: "loropiana", g: "form", tier: "D", name: "Loro Piana", target: "loropiana.com/textile",
      note: "Mostly above $150/yd, LVMH vetting, volume expectations. Listed for completeness — do not spend early effort here." }
  ];

  var GROUPS = [
    { key: "email", title: "Send the drafts", blurb: "Twenty of these are written and waiting in Gmail — open each, check the address, hit send. All twenty-three are drafted — the three marked NEW (CIMEXLANA, Novalan, Incalpaca) came out of the budget-tier research, written bilingual for the Mexican mills." },
    { key: "call", title: "Make the calls", blurb: "Most of these publish no usable email. Nine are landlines or toll-free lines and cannot receive a text at all \u2014 a text sent to them silently goes nowhere. Only two are mobile numbers, and both of those want WhatsApp rather than SMS. So this group is a calling list, not a texting list." },
    { key: "form", title: "Fill the forms", blurb: "These have no email either \u2014 they take web forms or trade-account signups. The paste block below covers every field these ask for." }
  ];

  var PASTE = [
    "Company:  Blessed & Dressed",
    "Contact:  Chase Stanley",
    "Location: Alexandria, Louisiana, USA",
    "Phone:    +1 318 827 9694",
    "Web:      customsuits.net",
    "Country:  United States",
    "Business: Custom menswear — individual made-to-measure suits, sport",
    "          coats, trousers, vests and shirts, cut one at a time to each",
    "          customer's measurements, with full-canvas construction.",
    "",
    "What we are looking for",
    "  Suiting  — all-wool worsted and wool-rich blends, 250–290 gsm,",
    "             150 cm width, plain weave and twill. High-twist and",
    "             tropical qualities, 220–260 gsm, for warm weather.",
    "             Please state composition, Super count and micron.",
    "  Shirting — 100% cotton, 110–140 gsm, 150 cm, two-ply yarns, in",
    "             poplin, twill, oxford and royal oxford. Also woven",
    "             cotton/elastane stretch at 96/4 or 97/3, weft stretch.",
    "",
    "What we need to know",
    "  1. How a US business opens a trade account, and what documents.",
    "  2. Swatch cards or bunches — available, and on what terms?",
    "  3. Minimum cut per order. Can you cut a single suit length (3.2 m)",
    "     or shirt length (2 m)?",
    "  4. Price per metre at the specs above, and your price breaks.",
    "  5. Lead time and dispatch.",
    "  6. Shipping to the US — incoterm, and who carries duty?",
    "  7. Any minimum annual purchase tied to holding your books?",
    "  8. Are these continuity qualities we can reorder in twelve months?",
    "",
    "We can provide a courier account or pay courier charges for samples."
  ].join("\n");

  // ---- stages ---------------------------------------------------------------
  var STAGES = [
    { key: "todo",      label: "To contact",  hint: "Not yet approached" },
    { key: "contacted", label: "Contacted",   hint: "Sent \u2014 waiting on them" },
    { key: "replied",   label: "Replied",     hint: "They answered \u2014 your move" },
    { key: "warm",      label: "Warm",        hint: "Good lead, revisit later" },
    { key: "won",       label: "Account open",hint: "Trading, or books on the way" },
    { key: "no",        label: "No",          hint: "Declined or dead" }
  ];
  var STAGE_KEYS = STAGES.map(function (s) { return s.key; });

  // ---- state ----------------------------------------------------------------
  function readState() {
    var empty = { v: 2, stage: {}, note: {}, updated: null };
    try {
      var s = JSON.parse(document.getElementById("state").textContent);
      if (!s || typeof s !== "object") return empty;
      // migrate v1 { done: {id:true} } -> v2 stages
      if (!s.v && s.done && typeof s.done === "object") {
        var mig = { v: 2, stage: {}, note: {}, updated: s.updated || null };
        Object.keys(s.done).forEach(function (id) { if (s.done[id]) mig.stage[id] = "contacted"; });
        return mig;
      }
      s.stage = s.stage && typeof s.stage === "object" ? s.stage : {};
      s.note = s.note && typeof s.note === "object" ? s.note : {};
      return s;
    } catch (e) { return empty; }
  }

  var state = readState();
  var filter = "all";        // per-viewer only, never published
  var writable = true, api = null, pending = null, waited = 0, saveMsg = "", saveWarn = false;

  function stageOf(id) {
    var v = state.stage[id];
    return STAGE_KEYS.indexOf(v) === -1 ? "todo" : v;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function href(t) {
    if (t.g === "email") return "mailto:" + t.target;
    if (t.g === "call") return "tel:" + t.target.replace(/[^+0-9]/g, "");
    if (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(t.target)) return "https://" + t.target.replace(/^https?:\/\//, "");
    return null;
  }

  function counts() {
    var c = {}; STAGE_KEYS.forEach(function (k) { c[k] = 0; });
    TASKS.forEach(function (t) { c[stageOf(t.id)]++; });
    return c;
  }

  // ---- render ---------------------------------------------------------------
  function renderBody() {
    var c = counts();
    var live = TASKS.length - c.todo - c.no;

    var h = "";
    h += '<header class="masthead">';
    h += '<p class="eyebrow">Blessed &amp; Dressed \u00b7 Cloth Sourcing \u00b7 Outreach</p>';
    h += "<h1>The Cloth Call Sheet</h1>";
    h += '<p class="standfirst">Every supplier worth contacting, and where each one actually stands. Set a stage as things move \u2014 the page remembers.</p>';

    h += '<div class="board">';
    h += '<div class="cell"><div class="n">' + c.todo + '</div><div class="l">To contact</div></div>';
    h += '<div class="cell wait"><div class="n">' + c.contacted + '</div><div class="l">Waiting</div></div>';
    h += '<div class="cell act"><div class="n">' + c.replied + '</div><div class="l">Your move</div></div>';
    h += '<div class="cell"><div class="n">' + c.warm + '</div><div class="l">Warm</div></div>';
    h += '<div class="cell won"><div class="n">' + c.won + '</div><div class="l">Account open</div></div>';
    h += '<div class="cell"><div class="n">' + c.no + '</div><div class="l">No</div></div>';
    h += "</div>";
    h += '<div class="saveline' + (saveWarn ? " warn" : "") + '">' + esc(saveMsg) + "</div>";
    h += "</header>";

    if (c.replied) {
      h += '<div class="callout stop"><h3>' + c.replied + " waiting on you</h3>";
      h += "<p>A supplier who replied and then heard nothing is worse than one you never contacted. These are the rows marked <strong>Replied</strong> \u2014 filter to them below.</p></div>";
    }

    if (!writable) {
      h += '<div class="callout stop"><h3>This is a read-only view</h3>';
      h += "<p>Changes will not save from here. Open the artifact from your own gallery to update it.</p></div>";
    }

    h += "<section>";
    h += '<div class="filters">';
    h += '<button type="button" data-f="all" aria-pressed="' + (filter === "all") + '">All ' + TASKS.length + "</button>";
    h += '<button type="button" data-f="live" aria-pressed="' + (filter === "live") + '">In play ' + live + "</button>";
    STAGES.forEach(function (s) {
      h += '<button type="button" data-f="' + s.key + '" aria-pressed="' + (filter === s.key) + '">' + esc(s.label) + " " + c[s.key] + "</button>";
    });
    h += "</div></section>";

    GROUPS.forEach(function (grp) {
      var rows = TASKS.filter(function (t) {
        if (t.g !== grp.key) return false;
        if (filter === "all") return true;
        if (filter === "live") return stageOf(t.id) !== "todo" && stageOf(t.id) !== "no";
        return stageOf(t.id) === filter;
      });
      if (!rows.length) return;
      var total = TASKS.filter(function (t) { return t.g === grp.key; }).length;
      h += "<section>";
      h += "<h2>" + esc(grp.title) + '<span class="tally">' + rows.length + " / " + total + "</span></h2>";
      if (filter === "all") h += '<p class="lede">' + esc(grp.blurb) + "</p>";
      h += '<div class="rows">';
      rows.forEach(function (t) {
        var st = stageOf(t.id);
        var link = href(t);
        h += '<div class="row s-' + st + '">';
        h += '<div class="body">';
        h += '<div class="rowtop">';
        h += '<span class="name">' + esc(t.name) + "</span>";
        h += '<span class="chip ' + t.tier.toLowerCase() + '">TIER ' + esc(t.tier) + "</span>";
        h += '<select data-id="' + esc(t.id) + '" aria-label="Stage for ' + esc(t.name) + '"' + (writable ? "" : " disabled") + ">";
        STAGES.forEach(function (s) {
          h += '<option value="' + s.key + '"' + (s.key === st ? " selected" : "") + ">" + esc(s.label) + "</option>";
        });
        h += "</select>";
        h += "</div>";
        h += '<span class="target">' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(t.target) + "</a>" : esc(t.target)) + "</span>";
        h += '<span class="note">' + esc(t.note) + "</span>";
        h += '<div class="noteline"><input type="text" data-note="' + esc(t.id) + '" value="' + esc(state.note[t.id] || "") + '" placeholder="What did they say? Terms, prices, next step\u2026"' + (writable ? "" : " disabled") + "></div>";
        h += "</div></div>";
      });
      h += "</div>";
      if (grp.key === "form" && filter === "all") {
        h += '<div class="paste"><h3>Paste this into any form</h3>';
        h += "<pre>" + esc(PASTE) + "</pre>";
        h += '<button type="button" id="copybtn">Copy to clipboard</button></div>';
      }
      h += "</section>";
    });

    h += "<footer>";
    h += "<p>Full detail on every supplier \u2014 price bands, swatch terms, cut-length policy, evidence \u2014 lives in <code>sourcing/FABRIC-SUPPLIERS.md</code>, with the strategy behind this sequence in <code>sourcing/OUTREACH-PLAN.md</code>.</p>";
    h += "<p>Never state your target price to any vendor. Ask what theirs is. And share no tech packs, patterns or customer data with the twelve mills that also make finished garments.</p>";
    if (state.updated) h += "<p>Last change " + esc(state.updated) + ".</p>";
    h += "</footer>";
    return h;
  }

  function paint() {
    document.getElementById("app").innerHTML = renderBody();
    var btn = document.getElementById("copybtn");
    if (btn) {
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(PASTE).then(function () {
          btn.textContent = "Copied";
          setTimeout(function () { btn.textContent = "Copy to clipboard"; }, 1800);
        }, function () { btn.textContent = "Press Ctrl+C to copy"; });
      });
    }
  }

  // ---- publish --------------------------------------------------------------
  function buildDocument() {
    var cssText = document.getElementById("page-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var fonts =
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
    var open = "<" + "script";
    var close = "<" + "/script>";
    return "<!doctype html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n" +
      "<title>The Cloth Call Sheet</title>\n" + fonts +
      "\n<style id=\"page-style\">" + cssText + "</style>\n</head>\n<body>\n" +
      '<div class="wrap" id="app"></div>\n' +
      open + ' type="application/json" id="state">' + JSON.stringify(state) + close + "\n" +
      open + ' id="app-script">' + js + close + "\n</body>\n</html>";
  }

  function setSave(msg, warn) {
    saveMsg = msg || ""; saveWarn = !!warn;
    var el = document.querySelector(".saveline");
    if (el) { el.textContent = saveMsg; el.className = "saveline" + (saveWarn ? " warn" : ""); }
  }

  function flush() {
    pending = null;
    if (!writable) return;
    if (!api) {
      if (waited < 12000) { waited += 700; schedule(700); }
      else setSave("Saving is unavailable in this view.", true);
      return;
    }
    setSave("Saving\u2026", false);
    api.publish(buildDocument()).then(function () {}, function (err) {
      var code = (err && err.code) || "upstream_error";
      if (code === "conflict") { setSave("Someone else saved first \u2014 reloading to their version.", false); return; }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
          code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
        writable = false; paint(); setSave("Read-only view \u2014 changes are not saved.", true); return;
      }
      if (code === "rate_limited") { setSave("Saving too fast \u2014 pausing, then trying again.", true); schedule(6000); return; }
      setSave("Could not save that change. Try again in a moment.", true);
    });
  }

  function schedule(delay) {
    if (pending) clearTimeout(pending);
    pending = setTimeout(flush, delay == null ? 900 : delay);
  }

  function touched() {
    state.updated = new Date().toISOString().slice(0, 10);
    setSave("Saving\u2026", false);
    schedule();
  }

  // ---- events ---------------------------------------------------------------
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!writable || !el) return;
    if (el.tagName === "SELECT" && el.dataset.id) {
      if (el.value === "todo") delete state.stage[el.dataset.id];
      else state.stage[el.dataset.id] = el.value;
      paint();
      touched();
    } else if (el.tagName === "INPUT" && el.dataset.note) {
      var v = el.value.trim();
      if (v) state.note[el.dataset.note] = v.slice(0, 400);
      else delete state.note[el.dataset.note];
      touched();
    }
  });

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-f]") : null;
    if (!b) return;
    filter = b.dataset.f;
    paint();
  });

  paint();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      if (!ns) { writable = false; paint(); return; }
      api = ns;
    }, function () { writable = false; paint(); });
  } else { writable = false; paint(); }
})();
</script>
